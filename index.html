<style>
:root { --fg: #ff4fd8; --bg: #050505; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 20px/1.3 "VT323", ui-monospace, monospace; text-shadow: 0 0 6px var(--fg); }
#hero { position: relative; height: 100vh; height: 100svh; min-height: 560px; display: grid; place-items: center; overflow: hidden; }
#art { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Bubbles sit at --x/--y (% of hero) and bob independently */
.bubble { position: absolute; left: var(--x); top: var(--y); width: clamp(130px, 20vw, 200px); aspect-ratio: 1; margin: calc(clamp(130px, 20vw, 200px) / -2); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; border: 1px solid color-mix(in srgb, var(--fg) 55%, transparent); background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--fg) 14%, #000), #000 70%); box-shadow: 0 0 24px color-mix(in srgb, var(--fg) 25%, transparent), inset 0 0 30px rgba(0,0,0,.7); animation: float var(--d, 6s) ease-in-out infinite alternate; }
@keyframes float { from { transform: translate(-6px, 8px); } to { transform: translate(6px, -10px); } }
.bubble h2 { margin: 0; font-weight: 400; font-size: 28px; letter-spacing: .08em; }
.bubble a { color: var(--fg); text-decoration: none; padding: 0 8px; line-height: 1.15; }
/* Brand logos as masks so they take the phosphor colour */
.bubble a { display: inline-flex; align-items: center; gap: 6px; }
.bubble a[style]::before { content: ""; width: .8em; height: .8em; background: currentColor; -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }
.bubble a[data-g]::before { content: attr(data-g); width: .8em; text-align: center; }
.bubble a:hover, .bubble a:focus-visible { background: var(--fg); color: #000; text-shadow: none; outline: none; }
@media (max-width: 600px) { .bubble { font-size: 17px; } .bubble h2 { font-size: 22px; } }
/* CRT: scanlines + RGB mask, vignette, flicker. pointer-events off so links stay clickable */
body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10; }
body::before { background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,.35) 50%) 0 0 / 100% 3px, linear-gradient(90deg, rgba(255,0,0,.05), rgba(0,255,0,.02), rgba(0,0,255,.05)) 0 0 / 3px 100%; animation: flicker .15s infinite; }
body::after { background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.85) 100%); box-shadow: inset 0 0 120px rgba(0,0,0,.9); }
@keyframes flicker { 50% { opacity: .85; } }
#hero { animation: jitter 6s infinite; }
@keyframes jitter { 0%, 96%, 100% { transform: none; } 97% { transform: translateX(2px) skewX(.6deg); } 98% { transform: translateX(-2px); } }
/* Sprite redrawn as pink line art (see script); centrepiece */
#mascot { position: relative; width: clamp(120px, 20vw, 220px); image-rendering: pixelated; filter: drop-shadow(0 0 6px var(--fg)) drop-shadow(0 0 20px #000); cursor: pointer; animation: hover 2.4s ease-in-out infinite; }
@keyframes hover { 50% { transform: translateY(-10px); } }
#mascot.spin { animation: spin .6s ease-out; }
@keyframes spin { to { transform: rotate(360deg) scale(1.2); } }
#showcase { max-width: 640px; margin: 0 auto; padding: 48px 16px 80px; }
#showcase h2 { font-weight: 400; font-size: 36px; letter-spacing: .08em; margin: 0 0 12px; }
#showcase h2::before { content: "> "; opacity: .6; }
#tracks { list-style: none; margin: 0; padding: 0; counter-reset: t; }
#tracks button { counter-increment: t; width: 100%; text-align: left; font: inherit; font-size: 24px; color: var(--fg); text-shadow: inherit; background: none; border: 0; border-top: 1px dashed color-mix(in srgb, var(--fg) 35%, transparent); padding: 8px 4px; cursor: pointer; }
#tracks button::before { content: counter(t, decimal-leading-zero) "  ▶  "; opacity: .6; }
#tracks button.on::before { content: counter(t, decimal-leading-zero) "  ❚❚  "; opacity: 1; }
#tracks button:hover, #tracks button:focus-visible, #tracks button.on { background: var(--fg); color: #000; text-shadow: none; outline: none; }
#bar { height: 10px; border: 1px solid var(--fg); margin-top: 14px; cursor: pointer; }
#bar i { display: block; height: 100%; width: 0; background: var(--fg); box-shadow: 0 0 10px var(--fg); }
@media (prefers-reduced-motion: reduce) { #mascot, .bubble, #hero, body::before { animation: none; } }
</style>

<script>
// Wavy tethers from the mascot out to each bubble.
const c = document.getElementById('art'), g = c.getContext('2d');
const bubbles = [...document.querySelectorAll('.bubble')];
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let w, h;
function size() { const d = devicePixelRatio || 1; w = c.clientWidth; h = c.clientHeight; c.width = w * d; c.height = h * d; g.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', size); size();

function frame(t) {
  t /= 1000;
  g.shadowBlur = 0; // else the fade rect itself glows pink
  g.fillStyle = 'rgba(5,5,5,.18)'; g.fillRect(0, 0, w, h); // trail fade = phosphor afterglow
  g.strokeStyle = '#ff4fd8'; g.shadowColor = '#ff4fd8'; g.shadowBlur = 8; g.lineWidth = 1;
  const cx = w / 2, cy = h / 2;

  // three sine-wobbled strands from center to each bubble's live position
  const box = c.getBoundingClientRect();
  bubbles.forEach((el, j) => {
    const r = el.getBoundingClientRect();
    const bx = r.left + r.width / 2 - box.left, by = r.top + r.height / 2 - box.top;
    const dx = bx - cx, dy = by - cy, len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len;
    for (let s = 0; s < 3; s++) {
      g.globalAlpha = .7 - s * .2;
      g.beginPath();
      for (let i = 0; i <= 60; i++) {
        const p = i / 60, off = Math.sin(p * Math.PI) * Math.sin(p * 9 - t * 2 + s * 2 + j) * (10 + s * 6);
        const x = cx + dx * p + nx * off, y = cy + dy * p + ny * off;
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();
    }
  });
  g.globalAlpha = 1;
  if (!still) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// UI blips, same synth as numnuts' ui-sounds.js. Browsers keep audio locked until the first click/tap.
let ac, out;
function blip(freq, { to = freq, dur = .06, type = 'square', delay = 0, vol = 1 } = {}) {
  if (!ac || ac.state !== 'running') return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), e = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(to, t + dur);
  e.gain.setValueAtTime(0, t);
  e.gain.linearRampToValueAtTime(vol, t + .004);
  e.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(e).connect(out);
  o.start(t); o.stop(t + dur + .02);
}
addEventListener('pointerdown', () => {
  if (!ac) { ac = new AudioContext(); out = ac.createGain(); out.gain.value = .12; out.connect(ac.destination); }
  ac.resume();
}, { capture: true });

const links = [...document.querySelectorAll('.bubble a')];
links.forEach((a, i) => {
  a.addEventListener('pointerenter', () => blip(660 + i * 55, { dur: .035 }));
  a.addEventListener('focus', () => blip(660 + i * 55, { dur: .035 }));
  a.addEventListener('click', () => { blip(660, { dur: .07 }); blip(990, { dur: .12, delay: .07 }); });
});
// Mascot: dark sprite pixels -> phosphor pink, everything else transparent. Also used as favicon.
const mascot = document.getElementById('mascot'), mg = mascot.getContext('2d'), sprite = new Image();
sprite.onload = () => {
  mg.drawImage(sprite, 0, 0, 100, 100);
  const d = mg.getImageData(0, 0, 100, 100), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const ink = p[i + 3] > 128 && p[i] + p[i + 1] + p[i + 2] < 384;
    p[i] = 255; p[i + 1] = 79; p[i + 2] = 216; p[i + 3] = ink ? 255 : 0;
  }
  mg.putImageData(d, 0, 0);
  document.getElementById('fav').href = mascot.toDataURL();
};
sprite.src = document.getElementById('fav').href;
mascot.addEventListener('click', () => {
  mascot.classList.remove('spin'); void mascot.offsetWidth; mascot.classList.add('spin');
  blip(880, { to: 1760, dur: .25, type: 'triangle' });
});
mascot.addEventListener('animationend', () => mascot.classList.remove('spin'));

// Showcase player: one <audio>, track buttons toggle play/pause, bar seeks.
const player = document.getElementById('player'), bar = document.getElementById('bar'), fill = bar.firstElementChild;
const tracks = [...document.querySelectorAll('#tracks button')];
tracks.forEach((b, i) => b.addEventListener('click', () => {
  blip(660 + i * 55, { dur: .035 });
  if (b.classList.contains('on')) { player.pause(); return; }
  if (!player.src.endsWith(b.dataset.src)) player.src = b.dataset.src;
  player.play().catch(() => blip(110, { dur: .16, type: 'sawtooth', vol: .8 })); // missing file = error buzz
}));
const mark = () => tracks.forEach(b => b.classList.toggle('on', !player.paused && player.src.endsWith(b.dataset.src)));
player.addEventListener('play', mark); player.addEventListener('pause', mark);
player.addEventListener('ended', () => { const i = tracks.findIndex(b => player.src.endsWith(b.dataset.src)); tracks[i + 1]?.click(); });
player.addEventListener('timeupdate', () => fill.style.width = (player.currentTime / player.duration * 100 || 0) + '%');
bar.addEventListener('click', e => { if (player.duration) player.currentTime = e.offsetX / bar.clientWidth * player.duration; });

bubbles.forEach(b => b.addEventListener('pointerenter', () => blip(220, { to: 440, dur: .12, type: 'triangle', vol: .6 })));
</script>
</body>
</html>
